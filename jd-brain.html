<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digital JD Brain - Intelligent Leadership System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Talk through a leadership situation with Executive Advisor, or build a document, class, or plan with Executive Content Workshop." />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

// IMPORTANT: the Supabase UMD SDK registers a GLOBAL named `supabase`
// (window.supabase). Declaring `const supabase = ...` in a classic inline
// script collides with it -> "Identifier 'supabase' has already been
// declared" -> the whole script aborts, so nothing on the page wires up.
// Fix: reuse the working client auth.js already created (window.Auth.client,
// the one that handles sign-in) and expose it as the global `supabase` that
// the rest of this page's code references. Fall back to a fresh client only
// if auth.js didn't load, reading window.supabase.createClient BEFORE we
// overwrite the global.
window.supabase = (window.Auth && window.Auth.client)
  ? window.Auth.client
  : window.supabase.createClient(
      "https://hiejaayyeprfnrrukbam.supabase.co",

    );
// Local alias so existing code that refers to bare `supabase` keeps working.
var supabase = window.supabase;
</script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111c34;
      --panel-2: #16213d;
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --muted: #9fb0cc;
      --gold: #d4af37;
      --blue-1: #2563eb;
      --blue-2: #1d4ed8;
      --input: #0b1223;
      --shadow: 0 18px 48px rgba(0,0,0,0.32);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #081121 0%, #0f172a 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px 12px 32px;
    }

    .shell {
      width: 100%;
      max-width: 1400px;
    }

    .app {
      position: relative;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: appReveal 0.6s ease both;
    }

    .app::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #d4af37, #60a5fa, #d4af37, transparent);
      background-size: 200% 100%;
      animation: signalLine 5s linear infinite;
      z-index: 2;
    }

    .app-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      flex-wrap: wrap;
      gap: 12px;
      animation: fadeSlideUp 0.5s ease 0.05s both;
    }

    .app-top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-logo-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-wrap::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(212,175,55,0.5), transparent 70%);
      animation: glowPulse 2.6s ease-in-out infinite;
      z-index: 0;
    }

    .brand-logo {
      position: relative;
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
      z-index: 1;
    }

    .brand-stack {
      display: flex;
      flex-direction: column;
      gap: 0;
      line-height: 1.15;
    }

    .brand-line {
      color: var(--gold);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .app-top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(37, 99, 235, 0.16);
      border: 1px solid rgba(37, 99, 235, 0.32);
      border-radius: 999px;
      color: #dbeafe;
      font-size: 13px;
      white-space: nowrap;
      font-family: Georgia, serif;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #60a5fa;
    }

    .top-btn {
      background: transparent;
      border: 1px solid rgba(212,175,55,0.45);
      color: #d4af37;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: Georgia, serif;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .top-btn:hover {
      background: rgba(212,175,55,0.12);
    }

    .home-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      padding: 8px 4px;
      white-space: nowrap;
    }
    .home-link:hover { color: var(--text); }

    .chat-wrap {
      padding: 16px 20px 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.015));
      animation: fadeSlideUp 0.5s ease 0.12s both;
    }

    .chat-output {
      height: auto;
      min-height: 40px;
      max-height: 46vh;
      overflow-y: auto;
      padding-right: 6px;
      scroll-behavior: smooth;
    }

    /* On desktop there's plenty of vertical room — use more of it so the
       finished analysis (Situational Analysis / JD Insight / Execution Plan)
       is visible at once instead of being squeezed into a small scroll box. */
    @media (min-width: 900px) {
      .chat-output { max-height: 68vh; }
    }

    /* Final-analysis result: each section (Situational Analysis, JD Insight,
       Execution Plan, etc.) gets its own clearly separated card instead of
       one undifferentiated wall of text, so it's obvious the user has
       arrived at a new, distinct answer rather than still looking at the
       same box. */
    .analysis-panel {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .analysis-card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 14px;
      padding: 18px 20px;
    }

    .analysis-heading {
      color: var(--gold);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .analysis-body {
  color: var(--text);
  font-size: 16px;
  line-height: 1.65;
  white-space: pre-wrap;
  }

  .workshop-link {
  color: var(--gold);
  text-decoration: underline;
  text-decoration-color: rgba(212,175,55,0.5);
  cursor: pointer;
  font-weight: 600;
  }

  .workshop-link:hover, .workshop-link:focus-visible {
  text-decoration-color: var(--gold);
  outline: none;
  }

    .msg {
      margin-bottom: 12px;
      display: flex;
      width: 100%;
      animation: fadeSlideUp 0.35s ease both;
    }

    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 900px;
      width: fit-content;
      border-radius: 18px;
      padding: 14px 18px;
      line-height: 1.6;
      font-size: 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.22);
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(180deg, #2d4fe0, #2643bc);
      color: #ffffff;
      border-top-right-radius: 6px;
    }

    .assistant .bubble {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      color: var(--text);
      border: 1px solid var(--border);
      border-top-left-radius: 6px;
    }

    .composer {
      padding: 8px 20px 24px;
      animation: fadeSlideUp 0.5s ease 0.18s both;
    }

    /* Clarifying-questions panel: one bordered card per question, with its
       own dedicated answer field, so it's unmistakable where to type and
       the user works through one question at a time instead of everything
       being merged into a single shared box. */
    .clarify-panel {
      max-width: 1100px;
      width: 100%;
    }

    .clarify-card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(212,175,55,0.32);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      transition: opacity 0.2s ease;
    }

    .clarify-card:last-of-type { margin-bottom: 0; }

    .clarify-question-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
    }

    .clarify-q-number {
      color: var(--gold);
      font-weight: 700;
      flex: 0 0 auto;
    }

    .clarify-q-text {
      flex: 2 1 260px;
    }

    .clarify-answer-input {
      flex: 1 1 220px;
      min-width: 160px;
      background: var(--input);
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 8px;
      color: var(--text);
      font-family: Georgia, serif;
      font-size: 15px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .clarify-answer-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212,175,55,0.2);
    }

    .clarify-answer-input::placeholder { color: #6d7b96; }

    .clarify-answer-input:disabled {
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border-color: rgba(255,255,255,0.12);
    }

    /* Per-question dictate button, mirroring the main .mic-btn styling but
       sized to sit inline next to each answer field instead of anchored
       inside a single large textarea. */
    .clarify-mic-btn {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(212,175,55,0.8);
      background: #0b1223;
      color: #f6d36b;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      padding: 0;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .clarify-mic-btn:hover { transform: scale(1.06); }

    .clarify-mic-btn.is-listening {
      background: #7f1d1d;
      color: #ffffff;
      border-color: #ef4444;
      animation: micPulse 1.4s ease-in-out infinite;
    }

    .clarify-mic-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .clarify-answered .clarify-card { opacity: 0.72; }

    .clarify-hint {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .clarify-submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .clarify-continue-btn {
      background: linear-gradient(180deg, var(--blue-1), var(--blue-2));
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 700;
      font-family: Georgia, serif;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .clarify-continue-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(37,99,235,0.3);
    }

    .clarify-continue-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .mode-fork {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .mode-btn {
      position: relative;
      flex: 1 1 220px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(212,175,55,0.35);
      background: #0b1223;
      color: #c9d4e0;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
      font-family: Georgia, serif;
    }
    .mode-btn:hover {
      border-color: rgba(212,175,55,0.7);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.28);
    }
    .mode-btn-active {
      border-color: #d4af37;
      background: #14233f;
      box-shadow: 0 0 0 1px #d4af37 inset;
      animation: cardGlow 2.4s ease-in-out infinite;
    }
    .mode-btn-title {
      font-weight: 800;
      font-size: 15px;
      color: #f6d36b;
    }
    .mode-btn-sub {
      font-size: 12px;
      color: #9fb0c3;
    }

    .input-prompt {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .input-area-wrap {
      position: relative;
    }

    textarea#userInput {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.5;
    }
    textarea#userInput:focus {
      outline: none;
      border-color: rgba(212,175,55,0.6);
    }
    textarea#userInput::placeholder { color: #6b7a94; }

    .helper {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .mic-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(212,175,55,0.8);
      background: #0b1223;
      color: #f6d36b;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
      font-family: Georgia, serif;
      font-size: 13px;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .mic-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(212,175,55,0.25);
    }
    .mic-btn.is-listening {
      background: #7f1d1d;
      color: #ffffff;
      border-color: #ef4444;
      animation: micPulse 1.4s ease-in-out infinite;
    }

    .action-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .cta-full-btn {
      flex: 1 1 260px;
      background: linear-gradient(180deg, #101c33, #0b1223);
      color: #f6d36b;
      border: 1px solid rgba(212,175,55,0.7);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 800;
      font-family: Georgia, serif;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(212,175,55,0.15) inset, 0 10px 24px rgba(212,175,55,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .cta-full-btn:hover {
      transform: translateY(-2px);
      border-color: #d4af37;
      background: linear-gradient(180deg, #142441, #0d1730);
      box-shadow: 0 0 0 1px rgba(212,175,55,0.3) inset, 0 14px 30px rgba(212,175,55,0.3);
    }

    .send-btn {
      flex: 1 1 200px;
      background: linear-gradient(180deg, #101c33, #0b1223);
      color: #bcd0ff;
      border: 1px solid rgba(96,148,250,0.6);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 800;
      font-family: Georgia, serif;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(96,148,250,0.15) inset, 0 10px 24px rgba(37,99,235,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #6094fa;
      background: linear-gradient(180deg, #16244a, #0d1730);
      box-shadow: 0 0 0 1px rgba(96,148,250,0.3) inset, 0 14px 30px rgba(37,99,235,0.3);
    }
    .send-btn:active:not(:disabled) { transform: translateY(0); }
    .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .quick-btn {
      flex: 1 1 200px;
      background: transparent;
      border: 1px solid rgba(212,175,55,0.6);
      color: #f6d36b;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      font-family: Georgia, serif;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .quick-btn:hover:not(:disabled) {
      background: rgba(212,175,55,0.12);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(212,175,55,0.2);
    }
    .quick-btn:active:not(:disabled) { transform: translateY(0); }
    .quick-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes appReveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes signalLine {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes cardGlow {
      0%, 100% { box-shadow: 0 0 0 1px #d4af37 inset, 0 0 0 rgba(212,175,55,0); }
      50% { box-shadow: 0 0 0 1px #d4af37 inset, 0 0 18px rgba(212,175,55,0.45); }
    }

  @keyframes micPulse {
  0%, 100% { box-shadow: 0 0 0 rgba(239,68,68,0.5); }
  50% { box-shadow: 0 0 14px rgba(239,68,68,0.7); }
  }

  /* "Thinking" indicator: a small pulsing drop sending out rings, replacing
     the word "Thinking..." while Dr. Castle works through a response. */
  /* Sized 4x larger per JD's request — this is meant to be a noteworthy,
     impressive moment, not a small discreet spinner. */
  .thinking-ripple {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 144px;
  height: 144px;
  }
  .ripple-core {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 32px rgba(212,175,55,0.65);
  z-index: 1;
  }
  .ripple-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  border: 4px solid var(--gold);
  border-radius: 50%;
  opacity: 0;
  animation: rippleExpand 1.8s ease-out infinite;
  }
  .ripple-ring-2 { animation-delay: 0.6s; }
  .ripple-ring-3 { animation-delay: 1.2s; }

  @keyframes rippleExpand {
  0% { width: 40px; height: 40px; margin: -20px 0 0 -20px; opacity: 0.65; border-color: var(--gold); }
  70% { opacity: 0.18; border-color: #60a5fa; }
  100% { width: 144px; height: 144px; margin: -72px 0 0 -72px; opacity: 0; border-color: #60a5fa; }
  }

  @media (prefers-reduced-motion: reduce) {
  .app, .app::before, .app-top, .chat-wrap, .composer, .msg,
  .brand-logo-wrap::after, .mode-btn-active, .send-btn,
  .mic-btn.is-listening, .clarify-mic-btn.is-listening, .cta-full-btn, .ripple-ring {
  animation: none !important;
  transition: none !important;
  }
  .ripple-ring { opacity: 0.35 !important; }
  }

    @media (max-width: 720px) {
      .app-top { flex-direction: column; align-items: flex-start; }
      .app-top-right { width: 100%; justify-content: flex-start; }
      .mode-btn { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="app">
      <div class="app-top">
        <div class="app-top-left">
          <div class="brand-logo-wrap">
            <img src="digital-jd-logo.png" alt="Digital JD Bluehead Logo" class="brand-logo" />
          </div>
          <div class="brand-stack" aria-label="Intelligent Leadership System">
            <div class="brand-line">Intelligent</div>
            <div class="brand-line">Leadership</div>
            <div class="brand-line">System</div>
          </div>
        </div>

        <div class="app-top-right">
          <a href="jd-brain.html" class="home-link">Home</a>
          <span class="status-pill">
            <span class="dot"></span>
            <span id="systemStatus">Loading...</span>
          </span>
          <button id="manageSubscriptionButton" class="top-btn">Manage Subscription</button>
          <button id="signOutButton" class="top-btn">Sign out</button>
        </div>
      </div>

      <div class="chat-wrap">
        <div id="chatOutput" class="chat-output"></div>
      </div>

      <div class="composer" id="composerPanel">
        <div class="mode-fork" id="modeFork" role="tablist" aria-label="Choose how Digital JD helps you">
          <button type="button" id="modeAdvisorBtn" class="mode-btn mode-btn-active" role="tab" aria-selected="true" onclick="setMode('advisor')">
            <span class="mode-btn-title">Executive Advisor</span>
            <span class="mode-btn-sub">Talk through a leadership situation</span>
          </button>
          <button type="button" id="modeWorkshopBtn" class="mode-btn" role="tab" aria-selected="false" onclick="setMode('workshop')">
            <span class="mode-btn-title">Executive Content Workshop</span>
            <span class="mode-btn-sub">Build a document, class, or plan</span>
          </button>
        </div>

        <div class="input-prompt" id="inputPrompt">
          Describe your situation — the more detail you provide, the sharper the insight.
        </div>

        <div class="input-area-wrap">
          <textarea id="userInput" placeholder="Describe the leadership, communication, decision, or execution situation you want to work through."></textarea>
          <button id="micBtn" type="button" class="mic-btn">🎙️ Dictate</button>
        </div>

        <div class="helper" id="helperText">
          Digital JD will think through this with you and respond directly below.
        </div>

        <div class="action-row">
          <button id="sendBtn" class="send-btn" title="Dr. Castle asks a few clarifying questions first, then gives a fully-grounded recommendation">Get Deeper Insight</button>
          <button id="quickAnswerBtn" type="button" class="quick-btn" title="Skip the follow-up questions and get an immediate, surface-level answer to exactly what you asked">Initial Opinion</button>
          <button type="button" class="cta-full-btn" onclick="window.location.href='https://digitaljd.org/#pricing'">Explore Membership Plans</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Within-conversation memory: keep the same conversationId across a page
    // refresh (tab close still starts fresh, matching sessionStorage semantics)
    // so JD Brain can keep recalling earlier turns instead of losing them the
    // moment the page reloads.
    const CONVERSATION_ID_KEY = 'jdBrainConversationId';
    // These two travel WITH conversationId in sessionStorage: without them, a
    // refresh mid-clarify-flow would restore the id but forget the app was
    // waiting on answers to questions no longer visible on screen, causing
    // the next message to be misrouted back into "ask clarifying questions"
    // (see restoreConversationTranscript, which re-renders the visible
    // transcript so this state actually makes sense to the user again).
    const CONVERSATION_STAGE_KEY = 'jdBrainConversationStage';
    const PENDING_SITUATION_KEY = 'jdBrainPendingSituation';
    let conversationId = sessionStorage.getItem(CONVERSATION_ID_KEY) || null;
    let isSending = false;
    let currentMode = 'advisor';
    // Two-step advisor flow: 'new' -> user describes a situation and (in
    // Advisor mode) Digital JD asks clarifying questions first, exactly like
    // a real advisor would, before ever giving a recommendation.
    // 'awaiting_answers' -> the user is responding to those questions; the
    // NEXT send combines the original situation + their answers and asks for
    // the real, grounded advice.
    let conversationStage = sessionStorage.getItem(CONVERSATION_STAGE_KEY) || 'new';
    let pendingSituation = sessionStorage.getItem(PENDING_SITUATION_KEY) || '';

    function updateComposerForStage() {
      const composerPanel = document.getElementById('composerPanel');
      const quickBtn = document.getElementById('quickAnswerBtn');
      const sendBtn = document.getElementById('sendBtn');
      const inputPrompt = document.getElementById('inputPrompt');
      const userInput = document.getElementById('userInput');
      const helperText = document.getElementById('helperText');
      const modeFork = document.getElementById('modeFork');

      if (conversationStage === 'awaiting_answers') {
        // The clarifying questions above now have their own dedicated answer
        // fields — hide the shared composer entirely so there is only ONE
        // place to type, and it's obvious which question each answer belongs to.
        if (composerPanel) composerPanel.style.display = 'none';
        return;
      }

      if (composerPanel) composerPanel.style.display = '';
      sendBtn.textContent = 'Get Deeper Insight';
      if (modeFork) modeFork.style.display = '';
      const advisorActive = currentMode === 'advisor';
      if (quickBtn) quickBtn.style.display = advisorActive ? '' : 'none';

      if (advisorActive) {
        inputPrompt.textContent = 'Describe your situation — the more detail you provide, the sharper the insight.';
        userInput.placeholder = 'Describe the leadership, communication, decision, or execution situation you want to work through.';
        helperText.textContent = 'Get Deeper Insight: Digital JD asks a few sharp questions first to fully understand your situation, then delivers a grounded recommendation. In a hurry? Use Initial Opinion for an immediate, surface-level answer instead.';
      } else {
        inputPrompt.textContent = 'Tell Digital JD what to build — a document, training class, plan, email, or script.';
        userInput.placeholder = 'e.g., Draft a board memo on our Q3 restructuring, or build a training outline on giving hard feedback.';
        helperText.textContent = 'Digital JD will think through this with you and respond directly below.';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      conversationStage = 'new';
      pendingSituation = '';
      const advisorBtn = document.getElementById('modeAdvisorBtn');
      const workshopBtn = document.getElementById('modeWorkshopBtn');
      const advisorActive = mode === 'advisor';
      advisorBtn.classList.toggle('mode-btn-active', advisorActive);
      advisorBtn.setAttribute('aria-selected', advisorActive ? 'true' : 'false');
      workshopBtn.classList.toggle('mode-btn-active', !advisorActive);
      workshopBtn.setAttribute('aria-selected', !advisorActive ? 'true' : 'false');

      updateComposerForStage();
    }

    // Called when the user clicks the "Executive Content Workshop" mention
    // inside an analysis result's Communication Draft section. Switches the
    // mode toggle to Workshop, then scrolls/focuses the composer so the
    // click visibly does something instead of appearing to do nothing.
    function goToWorkshopMode() {
      setMode('workshop');
      const composer = document.getElementById('composerPanel');
      if (composer) {
        composer.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      const input = document.getElementById('userInput');
      if (input) {
        setTimeout(() => input.focus(), 300);
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // On a fresh page load with a conversationId already in sessionStorage
    // (i.e. a refresh, not a new tab/session), re-render the visible
    // transcript from the messages table so the screen matches the state
    // conversationStage/pendingSituation were just restored to above —
    // otherwise the chat looks empty while the app silently expects an
    // answer to questions the user can no longer see.
    async function restoreConversationTranscript() {
      if (!conversationId || !window.supabase) return;
      try {
        const { data: rows, error } = await window.supabase
          .from('messages')
          .select('role, content, created_at')
          .eq('conversation_id', conversationId)
          .order('created_at', { ascending: true });
        if (error || !Array.isArray(rows) || rows.length === 0) return;

        const isMidClarify = conversationStage === 'awaiting_answers';
        const lastIndex = rows.length - 1;
        rows.forEach((row, i) => {
          if (row.role !== 'user' && row.role !== 'assistant') return;
          // The most recent assistant message, when we're still waiting on
          // answers, IS the clarifying-questions list — rebuild it as the
          // interactive question/answer panel (same as the live flow), not
          // a plain read-only bubble, so there's somewhere to type again.
          if (isMidClarify && i === lastIndex && row.role === 'assistant') {
            const questions = parseClarifyingQuestions(row.content || '');
            const introBubble = addMessage('', 'assistant');
            if (questions.length >= 2) {
              renderClarifyingPanel(questions, introBubble);
            } else {
              introBubble.innerText = row.content || '';
            }
            return;
          }
          addMessage(row.content || '', row.role);
        });
      } catch (_e) {
        // Restoring the transcript is a nicety, never a blocker — if it
        // fails, the chat just starts visually empty, same as before.
      }
    }

    function addMessage(text, role) {
      const chatOutput = document.getElementById('chatOutput');
      const msg = document.createElement('div');
      msg.classList.add('msg', role);
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.style.whiteSpace = 'pre-wrap';
      bubble.innerText = text;
      msg.appendChild(bubble);
      chatOutput.appendChild(msg);
      chatOutput.scrollTop = chatOutput.scrollHeight;
      return bubble;
    }

    // Replaces the word "Thinking..." with the pulsing ripple symbol while
    // Digital JD works through a response.
    function showThinkingRipple(bubbleEl) {
      bubbleEl.innerHTML =
        '<span class="thinking-ripple" role="status" aria-label="Digital JD is thinking">' +
        '<span class="ripple-core"></span>' +
        '<span class="ripple-ring ripple-ring-1"></span>' +
        '<span class="ripple-ring ripple-ring-2"></span>' +
        '<span class="ripple-ring ripple-ring-3"></span>' +
        '</span>';
    }

    // The gateway's clarify-mode reply is a plain numbered list ("1. ...",
    // "2. ...", etc. — see buildClarifyingPrompt). Split it into individual
    // question strings so each one can get its own answer box.
    function parseClarifyingQuestions(replyText) {
      if (!replyText) return [];
      const lines = replyText.split('\n').map(l => l.trim()).filter(Boolean);
      const questions = [];
      const numbered = /^(\d+)[.)]\s*(.+)$/;
      for (const line of lines) {
        const m = line.match(numbered);
        if (m) {
          questions.push(m[2].trim());
        } else if (questions.length) {
          // A question that wrapped onto its own line without a new number.
          questions[questions.length - 1] += ' ' + line;
        }
      }
      return questions;
    }

    // Renders the clarifying questions as individual cards, each with its
    // own answer field right after the question — one question at a time,
    // clearly separated, instead of everything merged into one shared box.
    function renderClarifyingPanel(questions, introBubble) {
      introBubble.innerText = 'Before I can advise you well, I need to understand your situation a bit more. Answer what you can below:';

      const chatOutput = document.getElementById('chatOutput');
      const wrapMsg = document.createElement('div');
      wrapMsg.classList.add('msg', 'assistant');

      const panel = document.createElement('div');
      panel.classList.add('clarify-panel');
      panel.id = 'activeClarifyPanel';

      questions.forEach((q, i) => {
        const card = document.createElement('div');
        card.classList.add('clarify-card');

        const row = document.createElement('div');
        row.classList.add('clarify-question-row');

        const num = document.createElement('span');
        num.classList.add('clarify-q-number');
        num.textContent = (i + 1) + '.';

        const qText = document.createElement('span');
        qText.classList.add('clarify-q-text');
        qText.textContent = q;

        const answerInput = document.createElement('input');
        answerInput.type = 'text';
        answerInput.classList.add('clarify-answer-input');
        answerInput.placeholder = 'Type your answer here...';
        answerInput.dataset.question = q;
        answerInput.setAttribute('aria-label', 'Your answer to question ' + (i + 1) + ': ' + q);
        answerInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
            e.preventDefault();
            const nextInput = panel.querySelectorAll('.clarify-answer-input')[i + 1];
            if (nextInput) nextInput.focus();
            else document.getElementById('clarifyContinueBtn')?.focus();
          }
        });

        const fieldMicBtn = document.createElement('button');
        fieldMicBtn.type = 'button';
        fieldMicBtn.classList.add('clarify-mic-btn');
        fieldMicBtn.textContent = '🎙️';
        fieldMicBtn.setAttribute('aria-label', 'Dictate your answer');
        attachFieldDictation(fieldMicBtn, answerInput);

        row.appendChild(num);
        row.appendChild(qText);
        row.appendChild(answerInput);
        row.appendChild(fieldMicBtn);
        card.appendChild(row);
        panel.appendChild(card);
      });

      const hint = document.createElement('div');
      hint.classList.add('clarify-hint');
      hint.textContent = 'A sentence or two per question is plenty — answer as many as you can, then continue.';

      const submitRow = document.createElement('div');
      submitRow.classList.add('clarify-submit-row');
      const continueBtn = document.createElement('button');
      continueBtn.type = 'button';
      continueBtn.classList.add('clarify-continue-btn');
      continueBtn.id = 'clarifyContinueBtn';
      continueBtn.textContent = 'Continue';
      continueBtn.addEventListener('click', submitClarifyingAnswers);
      submitRow.appendChild(continueBtn);

      panel.insertBefore(hint, panel.firstChild);
      panel.appendChild(submitRow);
      wrapMsg.appendChild(panel);
      chatOutput.appendChild(wrapMsg);
      chatOutput.scrollTop = chatOutput.scrollHeight;

      const firstInput = panel.querySelector('.clarify-answer-input');
      if (firstInput) firstInput.focus();
    }

    // The gateway's final-advice reply uses fixed ALL-CAPS section headings
    // (see buildSystemPrompt: SITUATIONAL ANALYSIS / EXECUTIVE DRAFT,
    // JD INSIGHT, EXECUTION PLAN, COMMUNICATION DRAFT). Split the plain-text
    // reply into those sections so each can be shown as its own card.
    function parseAnalysisSections(replyText) {
      if (!replyText) return [];
      const KNOWN_HEADINGS = ['SITUATIONAL ANALYSIS', 'EXECUTIVE DRAFT', 'JD INSIGHT', 'EXECUTION PLAN', 'COMMUNICATION DRAFT'];
      const lines = replyText.split('\n');
      const sections = [];
      let current = null;
      for (const rawLine of lines) {
        const trimmed = rawLine.trim();
        const heading = KNOWN_HEADINGS.find(h => trimmed.toUpperCase() === h);
        if (heading) {
          current = { heading, body: [] };
          sections.push(current);
        } else if (current) {
          current.body.push(rawLine);
        }
      }
      return sections
        .map(s => ({ heading: s.heading, body: s.body.join('\n').trim() }))
        .filter(s => s.body);
    }

    // Renders the final advice as separate, clearly labeled cards (one per
    // section) instead of one plain-text block, so the user can immediately
    // see they've arrived at a distinct, structured answer.
    function renderAnalysisResult(replyText, introBubble) {
      const sections = parseAnalysisSections(replyText);
      if (sections.length < 2) {
        // Couldn't cleanly parse the expected headings — fall back to plain
        // text rather than showing a broken or empty panel.
        introBubble.innerText = replyText;
        return null;
      }

      introBubble.innerText = "Dr. Castle's analysis is ready below:";

      const chatOutput = document.getElementById('chatOutput');
      const wrapMsg = document.createElement('div');
      wrapMsg.classList.add('msg', 'assistant');

      const panel = document.createElement('div');
      panel.classList.add('analysis-panel');

      sections.forEach(s => {
        const card = document.createElement('div');
        card.classList.add('analysis-card');

        const h = document.createElement('div');
        h.classList.add('analysis-heading');
        h.textContent = s.heading;
        card.appendChild(h);

        const body = document.createElement('div');
        body.classList.add('analysis-body');
        // The Communication Draft section sometimes mentions "Executive
        // Content Workshop" as a pointer to the other mode. Make that
        // specific phrase an actual clickable link (was previously plain
        // text via textContent, so clicking it visibly did nothing) — every
        // other character is still HTML-escaped first so nothing else in
        // the AI's response text can inject markup.
        const escaped = escapeHtml(s.body);
        body.innerHTML = escaped.replace(
          /Executive Content Workshop/g,
          '<span class="workshop-link" role="link" tabindex="0" onclick="goToWorkshopMode()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();goToWorkshopMode();}">Executive Content Workshop</span>'
        );
        card.appendChild(body);

        panel.appendChild(card);
      });

      wrapMsg.appendChild(panel);
      chatOutput.appendChild(wrapMsg);
      return wrapMsg;
    }

    async function submitClarifyingAnswers() {
      if (isSending) return;
      const panel = document.getElementById('activeClarifyPanel');
      if (!panel) return;

      const inputs = Array.from(panel.querySelectorAll('.clarify-answer-input'));
      const qaPairs = inputs.map((inp, i) => {
        const q = inp.dataset.question || '';
        const a = inp.value.trim();
        return `Q${i + 1}: ${q}\nA${i + 1}: ${a || '(no answer provided)'}`;
      }).join('\n\n');

  inputs.forEach(inp => { inp.disabled = true; });
  panel.querySelectorAll('.clarify-mic-btn').forEach(btn => {
    btn.disabled = true;
    btn.classList.remove('is-listening');
  });
  const continueBtn = document.getElementById('clarifyContinueBtn');
      if (continueBtn) continueBtn.disabled = true;
      panel.classList.add('clarify-answered');
      panel.removeAttribute('id');

      document.getElementById('userInput').value = qaPairs;
      await sendMessage(false);
    }

    async function sendMessage(forceQuick) {
      if (isSending) return;

      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      if (recognition && isListening) {
        isListening = false;
        try { recognition.stop(); } catch (e) {}
        const micBtn = document.getElementById('micBtn');
        if (micBtn) {
          micBtn.textContent = '🎙️ Dictate';
          micBtn.classList.remove('is-listening');
        }
      }

      // Was this send answering the clarifying questions from the turn before?
      const isAnsweringClarify = conversationStage === 'awaiting_answers';
      // Only Advisor mode asks clarifying questions first — Workshop mode
      // (building a document/plan) goes straight through, same as before.
      // Initial Opinion always skips straight to the single-pass advice call.
      const isClarifyStep = currentMode === 'advisor' && !forceQuick && !isAnsweringClarify;

      isSending = true;
      const sendBtn = document.getElementById('sendBtn');
      const quickBtn = document.getElementById('quickAnswerBtn');
      sendBtn.disabled = true;
      if (quickBtn) quickBtn.disabled = true;
      sendBtn.textContent = 'Thinking...';

      addMessage(text, 'user');
      input.value = '';

      const pending = addMessage('', 'assistant');
      showThinkingRipple(pending);

      try {
        const { data: { user } } = await supabase.auth.getUser();

        if (!conversationId && user) {
          const { data } = await supabase
            .from('conversations')
            .insert({ user_id: user.id })
            .select()
            .single();
          conversationId = data ? data.id : null;
          if (conversationId) sessionStorage.setItem(CONVERSATION_ID_KEY, conversationId);
        }

        if (conversationId) {
          await supabase.from('messages').insert({
            conversation_id: conversationId,
            role: 'user',
            content: text
          });
        }

        // Combine the original situation with the user's answers so the
        // final advice call has the full picture, not just the follow-ups.
        const requestMessage = isAnsweringClarify
          ? `Original situation:\n${pendingSituation}\n\nAnswers to the clarifying questions:\n${text}`
          : text;
        const requestMode = isClarifyStep ? 'clarify' : currentMode;

        const response = await fetch('/api/jd-brain-gateway', {
          method: 'POST',
          headers: await jdBrainHeaders(),
          body: JSON.stringify({ message: requestMessage, mode: requestMode, conversationId })
        });

        if (response.status === 401 || response.status === 402) {
          const info = await response.json().catch(() => ({}));
          pending.innerText = info.error || 'Your session has ended. Please sign in again.';
          if (info.code === 'trial_expired') window.location.href = 'expired.html';
          else if (window.Auth) window.location.href = window.Auth.SIGNIN_URL;
          return;
        }

        const raw = await response.text();
        let data = null;
        try { data = JSON.parse(raw); } catch (e) {}

        if (!response.ok) {
          const serverMsg = (data && (data.error || data.message)) || raw || '';
          pending.innerText = 'Sorry, something went wrong (error ' + response.status + '). ' + serverMsg.slice(0, 300);
          return;
        }

        const aiReply = (data && data.reply) ? data.reply : 'Digital JD returned an empty response. Please try again.';

        if (isClarifyStep) {
          // Render each clarifying question as its own card with its own
          // answer field, instead of dumping the numbered list as plain text.
          const questions = parseClarifyingQuestions(aiReply);
          if (questions.length >= 2) {
            renderClarifyingPanel(questions, pending);
          } else {
            // Couldn't cleanly parse a numbered list — fall back to plain text
            // rather than showing a broken or empty panel.
            pending.innerText = aiReply;
          }
          // Hold the situation and wait for the user's answers before advising.
          pendingSituation = text;
          conversationStage = 'awaiting_answers';
          sessionStorage.setItem(PENDING_SITUATION_KEY, pendingSituation);
          sessionStorage.setItem(CONVERSATION_STAGE_KEY, conversationStage);
        } else {
          // Render the final advice as separate labeled sections (Situational
          // Analysis / JD Insight / Execution Plan, etc.) and scroll so the
          // top of the new answer is what the user sees first — a clear
          // signal they've arrived at a new, finished result.
          const resultMsg = renderAnalysisResult(aiReply, pending);
          if (resultMsg) {
            // scrollIntoView (rather than manual offsetTop math) reliably
            // scrolls the nearest scrollable ancestor (.chat-output) so the
            // TOP of the new result — starting with Situational Analysis —
            // is the first thing visible, instead of leaving the user
            // stranded mid-scroll on the old content.
            requestAnimationFrame(() => {
              resultMsg.scrollIntoView({ block: 'start', behavior: 'smooth' });
            });
          }
          // Either the full advice was just delivered, or this was an Initial
          // Opinion / Workshop request — either way, the topic is closed.
          pendingSituation = '';
          conversationStage = 'new';
          sessionStorage.removeItem(PENDING_SITUATION_KEY);
          sessionStorage.removeItem(CONVERSATION_STAGE_KEY);
        }

        if (conversationId) {
          await supabase.from('messages').insert({
            conversation_id: conversationId,
            role: 'assistant',
            content: aiReply
          });
        }
      } catch (err) {
        pending.innerText = 'The request failed (' + (err && err.message ? err.message : 'network error') + '). Please try again.';
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        if (quickBtn) quickBtn.disabled = false;
        updateComposerForStage();
      }
    }

    let recognition = null;
    let isListening = false;

    function setupDictation() {
      const micBtn = document.getElementById('micBtn');
      const userInput = document.getElementById('userInput');
      if (!micBtn || !userInput) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micBtn.addEventListener('click', () => {
          alert('Microphone dictation is not supported in this browser. Try Chrome.');
        });
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let baseText = '';

      recognition.onresult = function (event) {
        let finalText = '';
        let interimText = '';
        for (let i = 0; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += transcript + ' ';
          else interimText += transcript;
        }
        userInput.value = (baseText + finalText + interimText).trim();
      };

      recognition.onend = function () {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onerror = function (event) {
        console.log('[v0] Speech recognition error:', event.error);
      };

      micBtn.addEventListener('click', function () {
        if (!isListening) {
          baseText = userInput.value ? userInput.value.trim() + ' ' : '';
          try {
            recognition.start();
            isListening = true;
            micBtn.textContent = '■ Stop';
            micBtn.classList.add('is-listening');
          } catch (e) {}
        } else {
          isListening = false;
          try { recognition.stop(); } catch (e) {}
          micBtn.textContent = '🎙️ Dictate';
          micBtn.classList.remove('is-listening');
        }
      });
    }

    // Attaches a self-contained dictate button + its own SpeechRecognition
    // instance to a single input/textarea element. Used for each clarifying
    // question's answer field, which each need independent start/stop state
    // (unlike the single shared #micBtn/#userInput pair above).
    function attachFieldDictation(btnEl, inputEl) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        btnEl.addEventListener('click', () => {
          alert('Microphone dictation is not supported in this browser. Try Chrome.');
        });
        return;
      }

      const fieldRecognition = new SpeechRecognition();
      fieldRecognition.continuous = true;
      fieldRecognition.interimResults = true;
      fieldRecognition.lang = 'en-US';

      let fieldIsListening = false;
      let baseText = '';

      fieldRecognition.onresult = function (event) {
        let finalText = '';
        let interimText = '';
        for (let i = 0; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += transcript + ' ';
          else interimText += transcript;
        }
        inputEl.value = (baseText + finalText + interimText).trim();
      };

      fieldRecognition.onend = function () {
        if (fieldIsListening) {
          try { fieldRecognition.start(); } catch (e) {}
        }
      };

      fieldRecognition.onerror = function (event) {
        console.log('[v0] Speech recognition error (field):', event.error);
      };

      btnEl.addEventListener('click', function () {
        if (!fieldIsListening) {
          baseText = inputEl.value ? inputEl.value.trim() + ' ' : '';
          try {
            fieldRecognition.start();
            fieldIsListening = true;
            btnEl.textContent = '■';
            btnEl.classList.add('is-listening');
            btnEl.setAttribute('aria-label', 'Stop dictating');
          } catch (e) {}
        } else {
          fieldIsListening = false;
          try { fieldRecognition.stop(); } catch (e) {}
          btnEl.textContent = '🎙️';
          btnEl.classList.remove('is-listening');
          btnEl.setAttribute('aria-label', 'Dictate your answer');
        }
      });
    }

    async function jdBrainHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      try {
        if (window.Auth && window.Auth.client) {
          const { data } = await window.Auth.client.auth.getSession();
          const token = data && data.session && data.session.access_token;
          if (token) headers['Authorization'] = 'Bearer ' + token;
        }
      } catch (e) {}
      return headers;
    }

    async function openBillingPortal() {
      const btn = document.getElementById('manageSubscriptionButton');
      const original = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Opening...'; }

      let email;
      try {
        const { data: { user } } = await supabase.auth.getUser();
        email = user ? user.email : undefined;
      } catch (e) {}

      if (!email) {
        alert('Please sign in to manage your subscription.');
        if (btn) { btn.disabled = false; btn.textContent = original; }
        return;
      }

      try {
        const res = await fetch('/api/create-portal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert(data.error || 'Could not open the billing portal.');
        }
      } catch (e) {
        alert('Could not open the billing portal. Please try again.');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = original; }
      }
    }

    window.addEventListener('load', () => {
      if (window.Auth && window.Auth.enabled) {
        window.Auth.requireActiveSession();
      }

      const statusEl = document.getElementById('systemStatus');
      if (statusEl) statusEl.textContent = 'Subscription Active';

      const signOutButton = document.getElementById('signOutButton');
      if (signOutButton && window.Auth && window.Auth.enabled) {
        signOutButton.addEventListener('click', () => window.Auth.signOut());
      }

      const manageSubscriptionButton = document.getElementById('manageSubscriptionButton');
      if (manageSubscriptionButton) {
        manageSubscriptionButton.addEventListener('click', openBillingPortal);
      }

      const sendBtn = document.getElementById('sendBtn');
      if (sendBtn) sendBtn.addEventListener('click', () => sendMessage(false));

      const quickAnswerBtn = document.getElementById('quickAnswerBtn');
      if (quickAnswerBtn) quickAnswerBtn.addEventListener('click', () => sendMessage(true));

      updateComposerForStage();
      restoreConversationTranscript();

      setupDictation();

      const userInput = document.getElementById('userInput');
      if (userInput) {
        userInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
    });
  </script>
</body>
