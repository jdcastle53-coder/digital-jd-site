<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Executive Dashboard - Digital JD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Organization-wide leadership risk gauges with drill-down by department and individual across six risk domains." />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
window.supabase = (window.Auth && window.Auth.client)
  ? window.Auth.client
  : window.supabase.createClient(
      "https://hiejaayyeprfnrrukbam.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpZWphYXl5ZXByZm5ycnVrYmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NDI3OTAsImV4cCI6MjA4NjUxODc5MH0._gOINPPuGvuXMpEm_qv_cSkwemt7wvFl6QDADknq4Bg"
    );
var supabase = window.supabase;
  </script>

  <style>
    :root {
      --bg-deep: #060b18;
      --bg-mid: #0c1730;
      --panel: #0f1c38;
      --panel-2: #0a1428;
      --border: rgba(212,175,55,0.18);
      --text: #eef1f8;
      --muted: #9fb0cc;
      --gold: #d4af37;
      --gold-bright: #f3d576;
      --input: #0b1223;
      --shadow: 0 24px 64px rgba(0,0,0,0.55);
      --risk-low: #22c55e;
      --risk-mid: #f59e0b;
      --risk-high: #ef4444;
      --face-cream: #ecdcb0;
      --face-cream-2: #d8c391;
      --navy-deep: #0a1730;
      --navy-mid: #16264a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background:
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,175,55,0.10), transparent 60%),
        radial-gradient(ellipse 1100px 700px at 50% 110%, rgba(37,80,180,0.16), transparent 60%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100%;
    }
    body { display: flex; justify-content: center; padding: 16px 12px 40px; }
    .shell { width: 100%; max-width: 1180px; }
    .app {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(212,175,55,0.06);
      overflow: hidden;
    }
    .app::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #d4af37, #60a5fa, #d4af37, transparent);
      background-size: 200% 100%;
      animation: signalLine 5s linear infinite;
      z-index: 2;
    }
    @keyframes signalLine { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
    .app-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15); flex-wrap: wrap; gap: 12px;
    }
    .page-title-stack { display: flex; flex-direction: column; gap: 0; line-height: 1.2; }
    .page-title { color: var(--gold-bright); font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
    .page-subtitle { color: var(--muted); font-size: 12px; }
    .app-top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .home-link { color: var(--muted); text-decoration: none; font-size: 13px; padding: 8px 4px; white-space: nowrap; }
    .home-link:hover { color: var(--gold-bright); }
    .content { padding: 28px 20px 36px; }

    .state-panel { text-align: center; padding: 48px 20px; color: var(--muted); }
    .locked-card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(212,175,55,0.32);
      border-radius: 16px; padding: 32px 28px; text-align: center;
      max-width: 560px; margin: 20px auto 0;
    }
    .locked-title { color: #f6d36b; font-size: 19px; font-weight: 800; margin-bottom: 10px; }
    .locked-body { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .cta-full-btn {
      background: linear-gradient(180deg, #101c33, #0b1223);
      color: #f6d36b; border: 1px solid rgba(212,175,55,0.7);
      border-radius: 12px; padding: 14px 24px; font-size: 15px; font-weight: 800;
      font-family: Georgia, serif; cursor: pointer;
      box-shadow: 0 0 0 1px rgba(212,175,55,0.15) inset, 0 10px 24px rgba(212,175,55,0.18);
      transition: transform 0.15s ease;
    }
    .cta-full-btn:hover { transform: translateY(-1px); }

    .tab-row {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 13px;
      font-family: Georgia, serif;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: rgba(212,175,55,0.14);
      border-color: rgba(212,175,55,0.55);
      color: #f6d36b;
    }
    .tab-btn:hover { color: var(--text); }

    .selector-row {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .selector-row select {
      background: var(--input); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 12px; font-family: Georgia, serif; font-size: 13px;
      min-width: 180px;
    }
    .selector-label { color: var(--muted); font-size: 12px; }

    .view-caption { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .view-caption strong { color: var(--gold-bright); }

    /* ---------- Gauge grid, ported from JD's reference dashboard layout:
       top row small/large-center/small, bottom row three equal, both
       transparent so the navy/gold page backdrop shows through. ---------- */
    .domain-gauge-grid {
      width: 100%;
      margin: 0 auto;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 0 10px;
    }
    .gauge-row {
      width: 100%;
      max-width: 1450px;
      display: grid;
      grid-template-columns: 1fr 1.45fr 1fr;
      justify-items: center;
      align-items: end;
      column-gap: 35px;
    }
    .gauge-row.bottom {
      margin-top: 115px;
      grid-template-columns: repeat(3, 1fr);
    }
    .domain-gauge-cell { background: transparent; width: 100%; display: flex; justify-content: center; }
    .gauge-no-data-caption { color: var(--muted); font-size: 11px; margin-top: -8px; text-align: center; }

    @media (max-width: 1000px) {
      .gauge-row { column-gap: 15px; }
      .gauge-row.bottom { margin-top: 80px; }
    }
    @media (max-width: 750px) {
      .gauge-row { display: flex; flex-direction: column; align-items: center; gap: 45px; }
      .gauge-row.bottom { margin-top: 70px; }
      .domain-gauge-cell { width: min(330px, 94vw) !important; }
    }

    .setup-note {
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.28);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
      color: var(--muted); font-size: 13px; line-height: 1.6;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .setup-note a { color: #f6d36b; text-decoration: none; font-weight: 700; white-space: nowrap; }
    .setup-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app">
      <div class="app-top">
        <div class="app-top-left">
          <div class="page-title-stack">
            <div class="page-title">Executive Dashboard</div>
            <div class="page-subtitle">Leadership risk, company-wide</div>
          </div>
        </div>
        <div class="app-top-right">
          <a href="jd-brain.html" class="home-link">Back to Digital JD</a>
          <a href="org-admin.html" class="home-link">Organization Setup</a>
        </div>
      </div>

      <div class="content" id="content">
        <div class="state-panel" id="loadingState">Loading&hellip;</div>
      </div>
    </div>
  </div>

  <script>
(async function () {
  const contentEl = document.getElementById('content');

  function renderLocked() {
    contentEl.innerHTML = `
      <div class="locked-card">
        <div class="locked-title">Executive Feature</div>
        <div class="locked-body">
          The Executive Dashboard is available on the Digital JD Executive plan.
        </div>
        <a href="index.html#pricing"><button class="cta-full-btn">Explore Plans</button></a>
      </div>`;
  }

  function renderError(message) {
    contentEl.innerHTML = `<div class="state-panel">${message}</div>`;
  }

  let session;
  try {
    const { data } = await supabase.auth.getSession();
    session = data.session;
  } catch (e) {
    return renderError('Could not check your session. Please refresh and try again.');
  }

  if (!session) {
    window.location.href = 'signin.html?next=executive-dashboard.html';
    return;
  }

  const meta = session.user.user_metadata || {};
  if (meta.plan !== 'executive') {
    renderLocked();
    return;
  }

  let dashboardData = null;
  let activeTab = 'company'; // 'company' | 'department' | 'individual'
  let selectedDepartmentId = null; // null = all departments combined
  let selectedIndividualUserId = null; // null = all individuals combined
  let individualDeptFilter = null;

  async function loadData() {
    const res = await fetch('/api/dashboard-data', {
      headers: { Authorization: 'Bearer ' + session.access_token },
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Could not load dashboard data.');
    return json;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function riskColorHex(pct) {
    if (pct <= 33) return '#22c55e';
    if (pct <= 66) return '#f59e0b';
    return '#ef4444';
  }

  function riskStatusLabel(pct) {
    if (pct == null) return 'No data yet';
    if (pct <= 33) return 'Healthy';
    if (pct <= 66) return 'Watch';
    return 'Elevated Risk';
  }

  /* ---------- Executive-style thermometer gauge \u2014 rebuilt to match
     JD's approved reference image exactly: arched gold/navy tombstone
     frame, fixed "Risk Assessment" title, vertical 5-band color tube
     (violet\u2192blue\u2192green\u2192orange\u2192red, bottom to top) capped with a
     round bulb, tick-marked 0\u2013100 scale on the left, color-matched
     risk labels on the right, faint JD head/circuit watermark behind
     the tube, gold/navy digital readout below the tube, and a separate
     gold/navy nameplate banner beneath the frame carrying the
     department name. Do not redesign, simplify, or approximate. ---------- */
  function clamp(n, min, max) { return Math.min(Math.max(n, min), max); }

  let gaugeUid = 0;

  function gaugeTombstoneShape(x0, x1, bottomY, straightTopY, domeApexY, cornerR, fill) {
    const width = x1 - x0;
    const cx = (x0 + x1) / 2;
    const domeRy = straightTopY - domeApexY;
    const domeRx = width / 2;
    return `<rect x="${x0}" y="${straightTopY}" width="${width}" height="${bottomY - straightTopY}" rx="${cornerR}" fill="${fill}" />` +
      `<ellipse cx="${cx}" cy="${straightTopY}" rx="${domeRx}" ry="${domeRy}" fill="${fill}" />`;
  }

  function buildDomainGaugeSvg(name, pct, opts) {
    opts = opts || {};
    const uid = 'gauge' + (gaugeUid++);
    const hasData = pct != null;
    const score = clamp(hasData ? pct : 0, 0, 100);
    const size = opts.large ? 400 : 280;
    const safeName = escapeHtml(name);
    const cx = 170;

    const bandColors = ['#C90919', '#FFB10C', '#27CA69', '#0879E8', '#4324D6']; // Critical\u2192High\u2192Moderate\u2192Low\u2192VeryLow, top to bottom
    const labelColors = ['#B3081A', '#C96A0A', '#1E8A4C', '#0B62B0', '#2E2A8C'];
    const labels = ['Critical', 'High', 'Moderate', 'Low', 'Very Low'];
    const scaleNumbers = [100, 80, 60, 40, 20, 0];

    const tubeX0 = 141, tubeX1 = 199, tubeWidth = tubeX1 - tubeX0; // inner face bounds
    const tubeTopY = 171, tubeBottomY = 460; // bulb center; leaves room below for the digital readout
    const bandBoundaries = Array.from({ length: 6 }).map((_, i) => tubeTopY + (i * (tubeBottomY - tubeTopY)) / 5);

    const bandRects = bandColors.map((color, i) =>
      `<rect x="${tubeX0}" y="${bandBoundaries[i]}" width="${tubeWidth}" height="${bandBoundaries[i + 1] - bandBoundaries[i]}" fill="${color}" />`
    ).join('');

    const ticksAndNumbers = scaleNumbers.map((n, i) => {
      const y = bandBoundaries[i];
      return `<line x1="118" y1="${y}" x2="138" y2="${y}" stroke="#152A45" stroke-width="2.5" stroke-linecap="round" />` +
        `<text x="112" y="${y + 6}" fill="#12253F" font-size="19" font-weight="700" text-anchor="end" font-family="Arial, Helvetica, sans-serif">${n}</text>`;
    }).join('');

    const rightLabels = labels.map((label, i) => {
      const y = (bandBoundaries[i] + bandBoundaries[i + 1]) / 2;
      return `<line x1="206" y1="${y}" x2="222" y2="${y}" stroke="${labelColors[i]}" stroke-width="2.5" stroke-linecap="round" />` +
        `<text x="228" y="${y + 6}" fill="${labelColors[i]}" font-size="18" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">${escapeHtml(label)}</text>`;
    }).join('');

    return `
      <div class="risk-gauge-wrapper" style="width:${size}px;max-width:100%;">
        <svg viewBox="0 0 340 665" width="100%" height="auto" role="img" aria-label="${safeName} risk assessment ${hasData ? score : 'no data'}" style="display:block;overflow:visible;">
          <defs>
            <linearGradient id="gold-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF4B0" />
              <stop offset="13%" stop-color="#E7B94A" />
              <stop offset="28%" stop-color="#A96405" />
              <stop offset="46%" stop-color="#FFE890" />
              <stop offset="63%" stop-color="#C88411" />
              <stop offset="82%" stop-color="#FFF0A0" />
              <stop offset="100%" stop-color="#9A5702" />
            </linearGradient>
            <linearGradient id="navy-${uid}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#07182D" />
              <stop offset="25%" stop-color="#123E6B" />
              <stop offset="48%" stop-color="#062849" />
              <stop offset="70%" stop-color="#0A3158" />
              <stop offset="100%" stop-color="#020B15" />
            </linearGradient>
            <radialGradient id="face-${uid}" cx="42%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#FFFBEA" />
              <stop offset="45%" stop-color="#FBEAC0" />
              <stop offset="80%" stop-color="#F1D593" />
              <stop offset="100%" stop-color="#DBAD4F" />
            </radialGradient>
            <linearGradient id="display-${uid}" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#123B64" />
              <stop offset="43%" stop-color="#062441" />
              <stop offset="100%" stop-color="#010A12" />
            </linearGradient>
            <clipPath id="tubeClip-${uid}">
              <rect x="${tubeX0}" y="${tubeTopY}" width="${tubeWidth}" height="${tubeBottomY - tubeTopY}" rx="29" />
            </clipPath>
            <filter id="mainShadow-${uid}" x="-30%" y="-30%" width="160%" height="170%">
              <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.24" />
            </filter>
            <filter id="smallShadow-${uid}" x="-30%" y="-30%" width="160%" height="180%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
            </filter>
          </defs>

          <g filter="url(#mainShadow-${uid})">
            ${gaugeTombstoneShape(8, 332, 584, 210, 30, 30, `url(#gold-${uid})`)}
            ${gaugeTombstoneShape(17, 323, 576, 215, 42, 26, `url(#navy-${uid})`)}
            ${gaugeTombstoneShape(26, 314, 568, 220, 54, 22, `url(#gold-${uid})`)}
            ${gaugeTombstoneShape(35, 305, 560, 225, 66, 18, `url(#face-${uid})`)}

            <text x="${cx}" y="98" fill="#0A2E52" font-size="28" font-weight="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Risk</text>
            <text x="${cx}" y="130" fill="#0A2E52" font-size="28" font-weight="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Assessment</text>

            <g transform="translate(${cx} 330) scale(0.5) translate(-255 -235)" fill="none" stroke="#7FB3E0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.46">
              <path d="M220 317 L220 299 C205 291 194 279 190 265 L181 258 C176 254 177 247 182 242 L190 232 C190 194 209 161 241 151 C270 142 302 151 319 175 C329 189 334 207 333 228 L333 317" />
              <path d="M255 226 L255 166" />
              <circle cx="255" cy="159" r="6" />
              <path d="M240 220 L240 184 L229 173" />
              <circle cx="225" cy="169" r="6" />
              <path d="M225 230 L213 218 L213 200" />
              <circle cx="213" cy="193" r="6" />
              <path d="M270 220 L270 184 L282 172" />
              <circle cx="286" cy="168" r="6" />
              <path d="M284 232 L300 215 L300 197" />
              <circle cx="300" cy="190" r="6" />
              <path d="M225 230 L245 250" />
              <circle cx="225" cy="230" r="5" />
              <path d="M240 220 L255 235" />
              <circle cx="240" cy="220" r="5" />
              <path d="M270 220 L255 235" />
              <circle cx="270" cy="220" r="5" />
              <path d="M284 232 L264 252" />
              <circle cx="284" cy="232" r="5" />
            </g>

            <rect x="${tubeX0 - 5}" y="${tubeTopY - 5}" width="${tubeWidth + 10}" height="${tubeBottomY - tubeTopY + 10}" rx="34" fill="url(#gold-${uid})" />
            <g clip-path="url(#tubeClip-${uid})">
              ${bandRects}
            </g>

            <circle cx="${cx}" cy="${tubeBottomY}" r="44" fill="url(#gold-${uid})" />
            <circle cx="${cx}" cy="${tubeBottomY}" r="40" fill="#4324D6" />
            <ellipse cx="${cx - 12}" cy="${tubeBottomY - 12}" rx="10" ry="7" fill="rgba(255,255,255,0.35)" />

            ${ticksAndNumbers}
            ${rightLabels}

            <path d="M45 605 L295 605 L307 615 L307 645 L295 655 L45 655 L33 645 L33 615 Z" fill="url(#gold-${uid})" />
            <path d="M51 611 L289 611 L299 619 L299 641 L289 649 L51 649 L41 641 L41 619 Z" fill="url(#navy-${uid})" />
            <circle cx="44" cy="630" r="3.5" fill="#E8B33A" />
            <circle cx="296" cy="630" r="3.5" fill="#E8B33A" />
            <text x="${cx}" y="638" fill="#FFFFFF" font-size="24" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">${safeName}</text>
          </g>

          <g filter="url(#smallShadow-${uid})">
            <path d="M125 515 L215 515 L225 525 L225 545 L215 555 L125 555 L115 545 L115 525 Z" fill="url(#gold-${uid})" />
            <path d="M130 520 L210 520 L217 527 L217 543 L210 550 L130 550 L123 543 L123 527 Z" fill="url(#display-${uid})" />
            <circle cx="121" cy="535" r="3" fill="#E8B33A" />
            <circle cx="219" cy="535" r="3" fill="#E8B33A" />
            <text x="${cx}" y="544" fill="#FFD75B" font-size="30" font-weight="600" text-anchor="middle" font-family="'Courier New', monospace" letter-spacing="2">${hasData ? score : '\u2013'}</text>
          </g>
        </svg>
      </div>`;
  }

  function domainGaugeCellHtml(domain, avg, opts) {
    opts = opts || {};
    const pct = avg == null ? null : Math.round(((5 - avg) / 4) * 100);
    return `
      <div class="domain-gauge-cell">
        ${buildDomainGaugeSvg(domain.label, pct, { large: opts.large })}
      </div>`;
  }

  function renderDomainGaugeGrid(domainAverages) {
    const domains = dashboardData.domains;
    if (!domains || domains.length === 0) {
      return `<div class="state-panel">No risk domains configured yet.</div>`;
    }

    const cells = domains.map((d) => {
      const avg = domainAverages ? domainAverages[d.key] : null;
      return { domain: d, avg };
    });

    // Mirror the reference layout exactly when there are six domains:
    // top row = small / large-center / small, bottom row = three equal.
    if (cells.length === 6) {
      const top = [cells[0], cells[1], cells[2]];
      const bottom = [cells[3], cells[4], cells[5]];
      const topHtml = top.map((c, i) =>
        domainGaugeCellHtml(c.domain, c.avg, { large: i === 1 })
      ).join('');
      const bottomHtml = bottom.map((c) =>
        domainGaugeCellHtml(c.domain, c.avg, { large: false })
      ).join('');
      return `
        <div class="domain-gauge-grid">
          <div class="gauge-row top">${topHtml}</div>
          <div class="gauge-row bottom">${bottomHtml}</div>
        </div>`;
    }

    const html = cells.map((c) => domainGaugeCellHtml(c.domain, c.avg, { large: false })).join('');
    return `<div class="domain-gauge-grid"><div class="gauge-row">${html}</div></div>`;
  }

  function setupNoteHtml() {
    if (dashboardData.hasOrg && (dashboardData.departments.length > 0 || dashboardData.individuals.length > 1)) return '';
    return `
      <div class="setup-note">
        <span>Add departments and teammates to unlock department and company-wide comparisons.</span>
        <a href="org-admin.html">Set up organization &rarr;</a>
      </div>`;
  }

  function tabRowHtml() {
    return `
      <div class="tab-row">
        <button class="tab-btn ${activeTab === 'company' ? 'active' : ''}" data-tab="company">Company Overview</button>
        <button class="tab-btn ${activeTab === 'department' ? 'active' : ''}" data-tab="department">By Department</button>
        <button class="tab-btn ${activeTab === 'individual' ? 'active' : ''}" data-tab="individual">By Individual</button>
      </div>`;
  }

  function render() {
    if (!dashboardData.hasOrg) {
      contentEl.innerHTML = `
        <div class="setup-note">
          <span>You haven&rsquo;t set up your organization yet. Create departments and add your team to see risk data here.</span>
          <a href="org-admin.html">Set up organization &rarr;</a>
        </div>
        ${renderDomainGaugeGrid(null)}`;
      return;
    }

    let body = '';

    if (activeTab === 'company') {
      const c = dashboardData.company;
      const caption = c
        ? `<strong>Company Overview</strong> &mdash; ${c.submittedCount} of ${c.memberCount} people submitted`
        : `<strong>Company Overview</strong> &mdash; no data yet`;
      body = `
        <div class="view-caption">${caption}</div>
        ${renderDomainGaugeGrid(c ? c.domainAverages : null)}`;
    }

    if (activeTab === 'department') {
      const depts = dashboardData.departments;
      const options = ['<option value="">All Departments (combined)</option>']
        .concat(depts.map((d) => `<option value="${d.id}" ${d.id === selectedDepartmentId ? 'selected' : ''}>${escapeHtml(d.name)}</option>`))
        .join('');
      const selected = selectedDepartmentId ? depts.find((d) => d.id === selectedDepartmentId) : null;
      const gaugeData = selected || dashboardData.company;
      const title = selected ? escapeHtml(selected.name) : 'All Departments (combined)';
      const caption = gaugeData
        ? `<strong>${title}</strong> &mdash; ${gaugeData.submittedCount} of ${gaugeData.memberCount} people submitted`
        : `<strong>${title}</strong> &mdash; no data yet`;

      body = `
        <div class="selector-row">
          <span class="selector-label">Viewing:</span>
          <select id="deptSelect">${options}</select>
        </div>
        <div class="view-caption">${caption}</div>
        ${renderDomainGaugeGrid(gaugeData ? gaugeData.domainAverages : null)}`;
    }

    if (activeTab === 'individual') {
      const depts = dashboardData.departments;
      const deptOptions = ['<option value="">All Departments</option>']
        .concat(depts.map((d) => `<option value="${d.id}" ${d.id === individualDeptFilter ? 'selected' : ''}>${escapeHtml(d.name)}</option>`))
        .join('');

      const filteredIndividuals = dashboardData.individuals.filter((i) => !individualDeptFilter || i.departmentId === individualDeptFilter);
      const indivOptions = ['<option value="">All Individuals (combined)</option>']
        .concat(filteredIndividuals.map((i) => `<option value="${i.userId}" ${i.userId === selectedIndividualUserId ? 'selected' : ''}>${escapeHtml(i.email)}${i.hasSubmitted ? '' : ' (no submission yet)'}</option>`))
        .join('');

      const selected = selectedIndividualUserId ? dashboardData.individuals.find((i) => i.userId === selectedIndividualUserId) : null;
      let title, caption, domainAverages;
      if (selected) {
        title = escapeHtml(selected.email);
        caption = `<strong>${title}</strong> &mdash; ${selected.hasSubmitted ? 'latest submitted assessment' : 'no submission yet'}`;
        domainAverages = selected.hasSubmitted ? selected.domainAverages : null;
      } else {
        const combined = individualDeptFilter
          ? dashboardData.departments.find((d) => d.id === individualDeptFilter)
          : dashboardData.company;
        title = individualDeptFilter ? (dashboardData.departments.find((d) => d.id === individualDeptFilter)?.name || 'Selected Department') + ' (combined)' : 'All Individuals (combined)';
        caption = combined
          ? `<strong>${escapeHtml(title)}</strong> &mdash; ${combined.submittedCount} of ${combined.memberCount} people submitted`
          : `<strong>${escapeHtml(title)}</strong> &mdash; no data yet`;
        domainAverages = combined ? combined.domainAverages : null;
      }

      body = `
        <div class="selector-row">
          <span class="selector-label">Department:</span>
          <select id="indivDeptSelect">${deptOptions}</select>
          <span class="selector-label">Individual:</span>
          <select id="indivSelect">${indivOptions}</select>
        </div>
        <div class="view-caption">${caption}</div>
        ${renderDomainGaugeGrid(domainAverages)}`;
    }

    contentEl.innerHTML = tabRowHtml() + setupNoteHtml() + body;

    document.querySelectorAll('[data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeTab = btn.getAttribute('data-tab');
        render();
      });
    });

    const deptSelect = document.getElementById('deptSelect');
    if (deptSelect) {
      deptSelect.addEventListener('change', () => {
        selectedDepartmentId = deptSelect.value || null;
        render();
      });
    }

    const indivDeptSelect = document.getElementById('indivDeptSelect');
    if (indivDeptSelect) {
      indivDeptSelect.addEventListener('change', () => {
        individualDeptFilter = indivDeptSelect.value || null;
        selectedIndividualUserId = null;
        render();
      });
    }

    const indivSelect = document.getElementById('indivSelect');
    if (indivSelect) {
      indivSelect.addEventListener('change', () => {
        selectedIndividualUserId = indivSelect.value || null;
        render();
      });
    }
  }

  try {
    dashboardData = await loadData();
    render();
  } catch (e) {
    renderError(e.message || 'Could not load dashboard data.');
  }
})();
  </script>
</body>
</html>
