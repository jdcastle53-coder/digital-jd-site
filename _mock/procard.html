<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1524;--black:#05080f;--cyan:#00b4d8;--gold:#d4af37;--white-dim:rgba(240,244,248,.62);--white-faint:rgba(240,244,248,.12);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05080f;font-family:'Barlow Condensed',sans-serif;color:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 20px}
  .tier-card{background:var(--navy);padding:2.5rem 2rem;position:relative;width:340px;border:3px solid #fff}
  .tier-card.featured{border-color:#d4af37;background:linear-gradient(135deg,rgba(212,175,55,.08),var(--navy))}
  .tier-featured-tag{position:absolute;top:-1px;right:1.5rem;background:var(--cyan);color:var(--black);font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.2em;padding:.2rem .8rem;font-weight:700;text-transform:uppercase}
  .founding-pill{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:.5rem;white-space:nowrap;border:1.5px solid #f0c24f;background:radial-gradient(circle at center,rgba(255,195,0,.30),transparent 70%),linear-gradient(180deg,#2a1a05 0%,#090806 100%);box-shadow:0 0 12px rgba(255,210,90,.55),0 0 26px rgba(255,190,0,.30),0 4px 10px rgba(0,0,0,.4);padding:.5rem 1.1rem;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffe08c;text-shadow:0 0 10px rgba(255,220,120,.4)}
  .founding-pill .founding-star{color:#f0c24f;font-size:.9rem;filter:drop-shadow(0 0 6px rgba(255,210,90,.6))}
  .founding-pill strong{color:#fff;font-weight:700}
  .tier-name{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--cyan);margin-bottom:.8rem}
  .tier-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--white-faint)}
  .tier-items{list-style:none;margin-bottom:2rem}
  .tier-items li{font-size:.85rem;color:var(--white-dim);padding:.45rem 0;display:flex;align-items:center;gap:.6rem}
  .tier-items li.changed{color:#7fe3ff}
  .tier-items li::before{content:'';width:4px;height:4px;background:var(--cyan);border-radius:50%;flex-shrink:0}
  .tier-items li.changed::before{background:#7fe3ff;box-shadow:0 0 6px #7fe3ff}
  .price{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:var(--cyan)}
  .price small{font-size:1rem;font-weight:300;color:var(--white-dim)}
  .annual{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.15em;color:var(--white-dim);text-transform:uppercase;margin-top:.3rem}
  .annual i{color:#d4af37;font-style:italic}
  .btn{display:block;text-align:center;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:.95rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:.9rem 1rem;border-radius:10px;border:1px solid #d4af37;box-shadow:0 6px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);margin-top:1.25rem}
</style></head>
<body>
  <div class="tier-card featured">
    <div class="tier-featured-tag">Most Popular</div>
    <div class="founding-pill"><span class="founding-star">&#9733;</span>First 50 members &mdash; <strong>Lifetime $99</strong></div>
    <div class="tier-name">Pro</div>
    <div class="tier-title">Digital JD Pro</div>
    <ul class="tier-items">
      <li>Full system &mdash; no restrictions</li>
      <li>Complete analytical depth</li>
      <li>Unlimited usage</li>
      <li class="changed">All 3 reasoning rules active</li>
      <li>Priority output quality</li>
    </ul>
    <div style="padding-top:1.5rem;border-top:1px solid rgba(0,180,216,.2)">
      <div class="price">$399<small>/month</small></div>
      <div class="annual">or $3,990 / year <i>(save $798)</i></div>
    </div>
    <a class="btn" href="#">Get Digital JD Pro</a>
  </div>
</body></html>
