<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Executive Workspace | Digital JD</title>
  <link rel="stylesheet" href="executive-workspace.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="jd-dictation.js"></script>
  <script type="module" src="executive-workspace.mjs"></script>
</head>
<body>
  <header class="masthead">
    <a href="jd-brain.html">Digital JD</a>
    <a href="executive-dashboard.html">Executive Dashboard</a>
  </header>
  <main>
    <h1>Executive Workspace</h1>
    <p><strong>Evaluation version.</strong> Use a sample situation. Cases are saved in this browser.</p>
    <p id="status" role="status" aria-live="polite">Checking Executive access...</p>
    <section id="case-home" hidden aria-label="Executive cases">
      <form id="create-case">
        <label for="case-title">New case name</label>
        <input id="case-title" required maxlength="160" autocomplete="off">
        <button type="submit">Begin your case</button>
      </form>
      <h2>Resume a case</h2>
      <ul id="case-list"></ul>
    </section>
    <section id="workspace" hidden aria-label="Current case">
      <aside>
        <button id="all-cases" type="button">All cases</button>
        <nav id="stages" aria-label="Executive process"></nav>
      </aside>
      <article>
        <p id="case-name"></p>
        <h2 id="stage-title" tabindex="-1"></h2>
        <div id="stage-content"></div>
      </article>
    </section>
  </main>
</body>
</html>
