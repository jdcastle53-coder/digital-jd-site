<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reset Password - Digital JD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Set a new password for your Digital JD account." />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --ink: #0b3b66;
      --mist: #f3f7fb;
      --sea: #0ea5e9;
      --sage: #22c55e;
      --sand: #f6f2ea;
    }
    body {
      font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(14,165,233,0.12), transparent 45%),
                  radial-gradient(circle at 80% 10%, rgba(34,197,94,0.18), transparent 40%),
                  linear-gradient(180deg, var(--mist), var(--sand));
    }
    .title-font { font-family: "Newsreader", Georgia, serif; }
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,0.78); }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <main class="max-w-md mx-auto px-4 py-20">
    <a href="/" class="inline-flex items-center gap-3 mb-8">
      <img src="images/ai-jd-logo.png" alt="Digital JD Logo" class="w-12 h-12 rounded-xl" />
      <span class="font-semibold tracking-tight">Digital JD</span>
    </a>

    <section class="glass shadow-xl rounded-3xl p-8 border border-white">
      <h1 class="title-font text-3xl font-semibold text-[var(--ink)]">Set a new password</h1>
      <p id="statusMsg" class="mt-3 text-sm text-slate-600">Verifying your secure reset link&hellip;</p>

      <form id="resetForm" class="mt-6 space-y-4" style="display:none;">
        <label class="block">
          <span class="text-sm text-slate-700">New password</span>
          <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--sea)]" placeholder="At least 6 characters" />
        </label>
        <button type="button" id="updatePasswordBtn" class="w-full rounded-xl bg-[var(--ink)] text-white py-3 font-semibold hover:opacity-90">Update password</button>
      </form>

      <div id="resetMsg" class="mt-4 text-sm"></div>
    </section>
  </main>

  <script>
    const statusMsg = document.getElementById("statusMsg");
    const resetForm = document.getElementById("resetForm");
    const resetMsg = document.getElementById("resetMsg");
    const newPassword = document.getElementById("newPassword");
    const updateBtn = document.getElementById("updatePasswordBtn");

    // Reuse the shared Supabase client from auth.js (single source of truth for BAM keys).
    const db = window.Auth && window.Auth.client
      ? window.Auth.client
      : (window.supabase ? window.supabase.createClient(
          "https://hiejaayyeprfnrrukbam.supabase.co",
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpZWphYXl5ZXByZm5ycnVrYmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NDI3OTAsImV4cCI6MjA4NjUxODc5MH0._gOINPPuGvuXMpEm_qv_cSkwemt7wvFl6QDADknq4Bg"
        ) : null);

    function showForm() {
      statusMsg.textContent = "Enter your new Digital JD password below.";
      resetForm.style.display = "block";
    }

    function showError(message) {
      statusMsg.textContent = message;
      resetMsg.innerHTML = '<a href="signin.html" class="font-semibold text-[var(--ink)] underline">Request a new reset link</a>';
    }

    async function init() {
      if (!db) {
        showError("Could not load the secure session. Please try again.");
        return;
      }

      // Supabase v2 PKCE flow: code in the query string.
      const code = new URLSearchParams(window.location.search).get("code");
      if (code) {
        const { error } = await db.auth.exchangeCodeForSession(code);
        if (error) showError("This reset link has expired or was already used.");
        else showForm();
        return;
      }

      // Fallback: older implicit flow uses the hash fragment.
      const hash = new URLSearchParams(window.location.hash.replace("#", ""));
      const accessToken = hash.get("access_token");
      const refreshToken = hash.get("refresh_token");
      if (accessToken) {
        const { error } = await db.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        if (error) showError("This reset link has expired or was already used.");
        else showForm();
        return;
      }

      showError("This reset link has expired or was already used.");
    }

    updateBtn.addEventListener("click", async () => {
      const password = newPassword.value;
      if (!password || password.length < 6) {
        resetMsg.className = "mt-4 text-sm text-red-600";
        resetMsg.textContent = "Password must be at least 6 characters.";
        return;
      }
      updateBtn.disabled = true;
      updateBtn.textContent = "Updating\u2026";
      const { error } = await db.auth.updateUser({ password });
      if (error) {
        resetMsg.className = "mt-4 text-sm text-red-600";
        resetMsg.textContent = error.message;
        updateBtn.disabled = false;
        updateBtn.textContent = "Update password";
        return;
      }
      resetForm.style.display = "none";
      statusMsg.textContent = "Password updated.";
      resetMsg.className = "mt-4 text-sm text-slate-700";
      resetMsg.innerHTML = 'You\'re all set. <a href="signin.html" class="font-semibold text-[var(--ink)] underline">Return to sign in</a>.';
    });

    init();
  </script>
</body>
</html>
