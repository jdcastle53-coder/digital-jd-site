<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 40px; background: #0b1220; font-family: sans-serif; }
  .domain-gauge-grid { display: flex; flex-direction: column; gap: 24px; align-items: center; }
  .gauge-row { display: flex; gap: 24px; align-items: flex-end; justify-content: center; }
  .domain-gauge-cell { display: flex; }
  .risk-gauge-wrapper { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  let gaugeUid = 0;
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function buildDomainGaugeSvg(name, pct, opts) {
    opts = opts || {};
    const uid = 'gauge' + (gaugeUid++);
    const hasData = pct != null;
    const score = clamp(hasData ? pct : 0, 0, 100);
    const needleAngle = -120 + score * 2.4;
    const size = opts.large ? 430 : 300;
    const safeName = escapeHtml(name);

    return `
      <div class="risk-gauge-wrapper" style="width:${size}px;max-width:100%;">
        <svg viewBox="0 0 500 590" width="100%" height="auto" role="img" aria-label="${safeName} risk assessment ${hasData ? score : 'no data'}" style="display:block;overflow:visible;">
          <defs>
            <linearGradient id="navy-${uid}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#061b35" />
              <stop offset="35%" stop-color="#0c3e72" />
              <stop offset="65%" stop-color="#062746" />
              <stop offset="100%" stop-color="#020d1c" />
            </linearGradient>
            <linearGradient id="gold-${uid}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff1a8" />
              <stop offset="18%" stop-color="#e4a92b" />
              <stop offset="45%" stop-color="#fff0a0" />
              <stop offset="70%" stop-color="#b36a05" />
              <stop offset="100%" stop-color="#ffd967" />
            </linearGradient>
            <radialGradient id="face-${uid}" cx="45%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#fff9e5" />
              <stop offset="65%" stop-color="#f8df9f" />
              <stop offset="100%" stop-color="#e3b756" />
            </radialGradient>
            <linearGradient id="display-${uid}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#143b60" />
              <stop offset="45%" stop-color="#031b33" />
              <stop offset="100%" stop-color="#010b15" />
            </linearGradient>
            <linearGradient id="needle-${uid}" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#020d19" />
              <stop offset="55%" stop-color="#073868" />
              <stop offset="100%" stop-color="#03121f" />
            </linearGradient>
            <linearGradient id="spectrum-${uid}" x1="96" y1="318" x2="404" y2="318" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#5b21c9" />
              <stop offset="15%" stop-color="#3a5ce0" />
              <stop offset="32%" stop-color="#0ea5e9" />
              <stop offset="50%" stop-color="#22c55e" />
              <stop offset="66%" stop-color="#eab308" />
              <stop offset="82%" stop-color="#f97316" />
              <stop offset="100%" stop-color="#dc2626" />
            </linearGradient>
            <filter id="shadow-${uid}" x="-30%" y="-30%" width="160%" height="180%">
              <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.25" />
            </filter>
            <filter id="smallShadow-${uid}" x="-30%" y="-30%" width="160%" height="180%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
            </filter>
          </defs>

          <g filter="url(#shadow-${uid})">
            <circle cx="250" cy="240" r="213" fill="url(#gold-${uid})" />
            <circle cx="250" cy="240" r="204" fill="url(#navy-${uid})" />
            <circle cx="250" cy="240" r="192" fill="url(#gold-${uid})" />
            <circle cx="250" cy="240" r="181" fill="url(#face-${uid})" />

            <path d="M 96 318 A 177 177 0 1 1 404 318" fill="none" stroke="url(#spectrum-${uid})" stroke-width="48" />

            <image href="gauge-watermark-logo.png" x="153" y="130" width="194" height="179" preserveAspectRatio="xMidYMid meet" />

            ${Array.from({ length: 21 }).map((_, i) => {
              const angle = -120 + i * 12;
              const radians = (angle * Math.PI) / 180;
              const longTick = i % 5 === 0;
              const r1 = longTick ? 137 : 144;
              const r2 = 157;
              const x1 = 250 + r1 * Math.sin(radians);
              const y1 = 240 - r1 * Math.cos(radians);
              const x2 = 250 + r2 * Math.sin(radians);
              const y2 = 240 - r2 * Math.cos(radians);
              return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${longTick ? '#b77a05' : '#12283b'}" stroke-width="${longTick ? 4 : 2.5}" stroke-linecap="round" />`;
            }).join('')}

            <g transform="rotate(${needleAngle} 250 240)">
              <path d="M232 247 L250 79 L268 247 L258 239 L250 105 L242 239 Z" fill="url(#gold-${uid})" />
              <path d="M239 244 L250 94 L261 244 L254 236 L250 121 L246 236 Z" fill="url(#needle-${uid})" />
              <path d="M246 228 L250 126 L254 228 L250 217 Z" fill="#f3c658" opacity="0.75" />
            </g>

            <circle cx="250" cy="240" r="38" fill="url(#gold-${uid})" stroke="#795009" stroke-width="2" />
            <circle cx="250" cy="240" r="30" fill="url(#navy-${uid})" stroke="#e6b746" stroke-width="3" />
            <circle cx="250" cy="240" r="23" fill="url(#gold-${uid})" stroke="#664009" stroke-width="2" />
            <circle cx="243" cy="232" r="7" fill="rgba(255,255,255,.40)" />

            <text x="250" y="344" fill="#072347" font-size="26" font-weight="900" text-anchor="middle">Risk Assessment</text>

            <g filter="url(#smallShadow-${uid})">
              <rect x="185" y="365" width="130" height="64" rx="7" fill="url(#gold-${uid})" />
              <rect x="192" y="372" width="116" height="50" rx="4" fill="url(#display-${uid})" />
              <rect x="197" y="376" width="106" height="10" rx="3" fill="rgba(255,255,255,.08)" />
              <circle cx="198" cy="397" r="3" fill="#f4c148" />
              <circle cx="302" cy="397" r="3" fill="#f4c148" />
              <text x="250" y="411" fill="#ffe474" font-size="43" font-weight="700" text-anchor="middle" font-family="'Courier New', monospace" letter-spacing="2">${hasData ? score : '\u2013'}</text>
            </g>
          </g>

          <g filter="url(#smallShadow-${uid})">
            <path d="M105 475 L395 475 L410 490 L410 540 L395 555 L105 555 L90 540 L90 490 Z" fill="url(#gold-${uid})" />
            <path d="M111 483 L389 483 L401 495 L401 535 L389 547 L111 547 L99 535 L99 495 Z" fill="url(#navy-${uid})" />
            <circle cx="112" cy="515" r="5" fill="#eeb73c" />
            <circle cx="388" cy="515" r="5" fill="#eeb73c" />
            <text x="250" y="527" fill="white" font-size="31" font-weight="800" text-anchor="middle">${safeName}</text>
          </g>
        </svg>
      </div>`;
  }

  const domains = [
    { label: 'Procurement', pct: 22 },
    { label: 'Organization', pct: 78 },
    { label: 'Shipping', pct: 19 },
    { label: 'Engineering', pct: 50 },
    { label: 'Sales', pct: 27 },
    { label: 'Production', pct: 81 },
  ];

  const top = domains.slice(0, 3);
  const bottom = domains.slice(3, 6);

  const topHtml = top.map((d, i) => `<div class="domain-gauge-cell">${buildDomainGaugeSvg(d.label, d.pct, { large: i === 1 })}</div>`).join('');
  const bottomHtml = bottom.map((d) => `<div class="domain-gauge-cell">${buildDomainGaugeSvg(d.label, d.pct, { large: false })}</div>`).join('');

  document.getElementById('root').innerHTML = `
    <div class="domain-gauge-grid">
      <div class="gauge-row top">${topHtml}</div>
      <div class="gauge-row bottom">${bottomHtml}</div>
    </div>`;
</script>
</body>
</html>
